<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Cloud Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            text-align: center;
            padding: 100px 20px;
        }
        h1 {
            font-size: 42px;
            color: #38bdf8;
        }
        p {
            font-size: 20px;
            line-height: 1.8;
        }
        .card {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            max-width: 650px;
            margin: 30px auto;
        }
    </style>
</head>
<body>

    <h1>Welcome to My AWS Cloud Project</h1>

    <div class="card">
        <h2>Static Website Hosting</h2>
        <p>Hosted using Amazon EC2 and Nginx</p>
        <p>Website Backup Storage: Amazon S3</p>
        <p>Operating System: Amazon Linux 2023</p>
        <h3>Deployment Successful!</h3>
    </div>

</body>
</html>
